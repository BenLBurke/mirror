<title>Mirror Photos</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f2330;
    --border: #2a2f3d;
    --text: #eef0f4;
    --muted: #9aa1b2;
    --accent: #5b8cff;
    --accent-2: #4676ea;
    --danger: #ff5c6c;
    --danger-2: #e14a58;
    --ok: #35c48c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 96px;
  }
  header {
    padding: 20px 16px 12px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.4rem;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  #banner {
    margin: 0 16px 12px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
    display: none;
  }
  #banner.show { display: block; }
  #banner.error { background: #3a1a1e; color: #ffb3ba; border: 1px solid var(--danger-2); }
  #banner.warn { background: #3a2f14; color: #ffdb9a; border: 1px solid #7a5a1e; }
  #banner.ok { background: #123227; color: #a6f0d1; border: 1px solid #1f6b4c; }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 16px;
  }

  .add-row {
    display: flex;
    justify-content: center;
    margin-bottom: 18px;
  }
  .add-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 14px 28px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(91,140,255,0.35);
  }
  .add-btn:active { background: var(--accent-2); }
  input[type="file"] { display: none; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .tile {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .tile .badge {
    position: absolute;
    top: 6px;
    left: 6px;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .tile.new .badge { background: var(--ok); color: #06281c; }
  .tile.marked-delete .badge { background: var(--danger); color: #340a0f; }
  .tile.marked-delete img { opacity: 0.35; filter: grayscale(60%); }

  .tile button.remove {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(20,22,28,0.85);
    color: white;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
  }
  .tile.marked-delete button.remove {
    background: var(--ok);
  }
  .tile .caption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 6px 8px;
    font-size: 0.7rem;
    color: #d7dae2;
    background: linear-gradient(transparent, rgba(0,0,0,0.75));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 10px;
  }

  .savebar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(15,17,21,0.92);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .savebar .status {
    color: var(--muted);
    font-size: 0.85rem;
    flex: 1;
    text-align: right;
    min-width: 0;
  }
  .save-btn {
    background: var(--ok);
    color: #06281c;
    border: none;
    border-radius: 999px;
    padding: 13px 26px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .save-btn:disabled {
    background: #2b3140;
    color: #6b7180;
    cursor: not-allowed;
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .gate {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .gate-box {
    width: 100%;
    max-width: 320px;
    text-align: center;
  }
  .gate-box h2 {
    margin: 0 0 18px;
    font-size: 1.1rem;
    font-weight: 600;
  }
  #pinInput {
    width: 100%;
    box-sizing: border-box;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 16px;
    font-size: 1.6rem;
    letter-spacing: 0.6em;
    text-align: center;
    margin-bottom: 14px;
  }
  #pinInput:focus { outline: 2px solid var(--accent); }
  #pinSubmit {
    width: 100%;
  }
  .pin-error {
    color: var(--danger);
    font-size: 0.85rem;
    min-height: 1.2em;
    margin-top: 10px;
  }
</style>

<header>
  <h1>Mirror Photos</h1>
  <p>Add or remove the photos shown on the mirror</p>
</header>

<div id="banner"></div>

<div id="gate" class="gate" style="display:none;">
  <div class="gate-box">
    <h2>Enter the family passcode</h2>
    <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••" />
    <button id="pinSubmit" class="add-btn" type="button">Unlock</button>
    <div id="pinError" class="pin-error"></div>
  </div>
</div>

<main style="display:none;">
  <div class="add-row">
    <label class="add-btn" for="fileInput">+ Add Photos</label>
    <input id="fileInput" type="file" accept="image/*" multiple />
  </div>

  <div id="grid" class="grid"></div>
  <div id="emptyMsg" class="empty" style="display:none;">No photos yet. Tap "Add Photos" to upload some.</div>
</main>

<div class="savebar" style="display:none;">
  <div id="status" class="status"></div>
  <button id="saveBtn" class="save-btn" disabled>Save Changes</button>
</div>

<script>
(function () {
  "use strict";

  var CONFIG = {
    owner: "BenLBurke",
    repo: "mirror",
    branch: "master",
    dir: "Photos",
    token: "MIRROR_TOKEN_PLACEHOLDER",
    pinHash: "MIRROR_PIN_HASH_PLACEHOLDER"
  };

  var IMAGE_EXT = /\.(jpe?g|png|gif|webp)$/i;
  var API_ROOT = "https://api.github.com/repos/" + CONFIG.owner + "/" + CONFIG.repo + "/contents/";

  var existing = [];      // [{name, sha, download_url}]
  var pendingDeletes = {}; // name -> true
  var pendingUploads = []; // [{id, filename, blob, previewUrl}]

  var grid = document.getElementById("grid");
  var emptyMsg = document.getElementById("emptyMsg");
  var saveBtn = document.getElementById("saveBtn");
  var statusEl = document.getElementById("status");
  var banner = document.getElementById("banner");
  var fileInput = document.getElementById("fileInput");

  function showBanner(msg, kind) {
    banner.textContent = msg;
    banner.className = "show " + (kind || "");
  }
  function hideBanner() {
    banner.className = "";
  }

  function apiHeaders() {
    return {
      "Authorization": "Bearer " + CONFIG.token,
      "Accept": "application/vnd.github+json"
    };
  }

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function updateSaveButton() {
    var count = Object.keys(pendingDeletes).length + pendingUploads.length;
    saveBtn.disabled = count === 0;
    saveBtn.textContent = count === 0 ? "Save Changes" : "Save Changes (" + count + ")";
  }

  function render() {
    grid.innerHTML = "";
    var visibleExisting = existing.filter(function (p) { return true; });
    var total = visibleExisting.length + pendingUploads.length;
    emptyMsg.style.display = total === 0 ? "block" : "none";

    visibleExisting.forEach(function (photo) {
      var marked = !!pendingDeletes[photo.name];
      var tile = document.createElement("div");
      tile.className = "tile" + (marked ? " marked-delete" : "");

      var img = document.createElement("img");
      img.src = photo.download_url;
      img.loading = "lazy";
      tile.appendChild(img);

      if (marked) {
        var badge = document.createElement("div");
        badge.className = "badge";
        badge.textContent = "REMOVING";
        tile.appendChild(badge);
      }

      var btn = document.createElement("button");
      btn.className = "remove";
      btn.type = "button";
      btn.textContent = marked ? "↩" : "✕";
      btn.title = marked ? "Undo remove" : "Remove photo";
      btn.addEventListener("click", function () {
        if (pendingDeletes[photo.name]) {
          delete pendingDeletes[photo.name];
        } else {
          pendingDeletes[photo.name] = true;
        }
        render();
      });
      tile.appendChild(btn);

      var cap = document.createElement("div");
      cap.className = "caption";
      cap.textContent = photo.name;
      tile.appendChild(cap);

      grid.appendChild(tile);
    });

    pendingUploads.forEach(function (up) {
      var tile = document.createElement("div");
      tile.className = "tile new";

      var img = document.createElement("img");
      img.src = up.previewUrl;
      tile.appendChild(img);

      var badge = document.createElement("div");
      badge.className = "badge";
      badge.textContent = "NEW";
      tile.appendChild(badge);

      var btn = document.createElement("button");
      btn.className = "remove";
      btn.type = "button";
      btn.textContent = "✕";
      btn.title = "Cancel upload";
      btn.addEventListener("click", function () {
        pendingUploads = pendingUploads.filter(function (u) { return u.id !== up.id; });
        URL.revokeObjectURL(up.previewUrl);
        render();
      });
      tile.appendChild(btn);

      grid.appendChild(tile);
    });

    updateSaveButton();
  }

  function loadExisting() {
    setStatus("Loading photos…");
    return fetch(API_ROOT + encodeURIComponent(CONFIG.dir) + "?ref=" + CONFIG.branch, {
      headers: apiHeaders()
    })
      .then(function (res) {
        if (!res.ok) {
          return res.json().catch(function () { return {}; }).then(function (body) {
            throw new Error((body && body.message) || ("GitHub API error " + res.status));
          });
        }
        return res.json();
      })
      .then(function (items) {
        existing = items
          .filter(function (it) { return it.type === "file" && IMAGE_EXT.test(it.name); })
          .sort(function (a, b) { return a.name.localeCompare(b.name); });
        setStatus("");
        render();
      })
      .catch(function (err) {
        console.error(err);
        showBanner("Could not load photos: " + err.message, "error");
        setStatus("");
      });
  }

  function sanitizeName(name) {
    return name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
  }

  function loadBitmapSource(file) {
    if (window.createImageBitmap) {
      return createImageBitmap(file, { imageOrientation: "from-image" }).catch(function () {
        return loadViaImageElement(file);
      });
    }
    return loadViaImageElement(file);
  }

  function loadViaImageElement(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        resolve(img);
      };
      img.onerror = function (e) {
        URL.revokeObjectURL(url);
        reject(e);
      };
      img.src = url;
    });
  }

  function resizeImage(file, maxDim, quality) {
    if (file.type === "image/gif") {
      return Promise.resolve(file);
    }
    return loadBitmapSource(file)
      .then(function (source) {
        var w = source.width, h = source.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var outW = Math.max(1, Math.round(w * scale));
        var outH = Math.max(1, Math.round(h * scale));

        var canvas = document.createElement("canvas");
        canvas.width = outW;
        canvas.height = outH;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(source, 0, 0, outW, outH);

        return new Promise(function (resolve) {
          canvas.toBlob(function (blob) {
            resolve(blob || file);
          }, "image/jpeg", quality);
        });
      })
      .catch(function (err) {
        console.warn("Resize failed, using original file", err);
        return file;
      });
  }

  fileInput.addEventListener("change", function () {
    var files = Array.prototype.slice.call(fileInput.files || []);
    fileInput.value = "";
    if (!files.length) return;

    setStatus("Preparing " + files.length + " photo" + (files.length > 1 ? "s" : "") + "…");

    Promise.all(files.map(function (file, idx) {
      return resizeImage(file, 1920, 0.82).then(function (blob) {
        var ext = blob.type === "image/jpeg" ? ".jpg" : (file.name.match(/\.[a-zA-Z0-9]+$/) || [".jpg"])[0];
        var filename = "family_" + Date.now() + "_" + idx + "_" + sanitizeName(file.name.replace(/\.[a-zA-Z0-9]+$/, "")) + ext;
        pendingUploads.push({
          id: filename,
          filename: filename,
          blob: blob,
          previewUrl: URL.createObjectURL(blob)
        });
      });
    })).then(function () {
      setStatus("");
      render();
    });
  });

  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var result = reader.result;
        resolve(result.substring(result.indexOf(",") + 1));
      };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function apiPut(path, body) {
    return fetch(API_ROOT + path, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, apiHeaders()),
      body: JSON.stringify(body)
    });
  }

  function apiDelete(path, body) {
    return fetch(API_ROOT + path, {
      method: "DELETE",
      headers: Object.assign({ "Content-Type": "application/json" }, apiHeaders()),
      body: JSON.stringify(body)
    });
  }

  function deleteOne(name, sha, attempt) {
    var path = encodeURIComponent(CONFIG.dir) + "/" + encodeURIComponent(name);
    return apiDelete(path, {
      message: "Remove photo " + name + " (family mirror uploader)",
      sha: sha,
      branch: CONFIG.branch
    }).then(function (res) {
      if (res.status === 409 && !attempt) {
        return fetch(API_ROOT + path + "?ref=" + CONFIG.branch, { headers: apiHeaders() })
          .then(function (r) { return r.json(); })
          .then(function (info) { return deleteOne(name, info.sha, true); });
      }
      if (!res.ok) {
        return res.json().catch(function () { return {}; }).then(function (body) {
          throw new Error(name + ": " + ((body && body.message) || res.status));
        });
      }
    });
  }

  function uploadOne(upload) {
    var path = encodeURIComponent(CONFIG.dir) + "/" + encodeURIComponent(upload.filename);
    return blobToBase64(upload.blob).then(function (b64) {
      return apiPut(path, {
        message: "Add photo " + upload.filename + " (family mirror uploader)",
        content: b64,
        branch: CONFIG.branch
      });
    }).then(function (res) {
      if (!res.ok) {
        return res.json().catch(function () { return {}; }).then(function (body) {
          throw new Error(upload.filename + ": " + ((body && body.message) || res.status));
        });
      }
    });
  }

  saveBtn.addEventListener("click", function () {
    hideBanner();
    saveBtn.disabled = true;
    var deletes = Object.keys(pendingDeletes);
    var uploads = pendingUploads.slice();
    var total = deletes.length + uploads.length;
    var done = 0;
    var errors = [];

    function tick(label) {
      done++;
      setStatus("Saving " + done + "/" + total + " (" + label + ")…");
    }

    var shaByName = {};
    existing.forEach(function (p) { shaByName[p.name] = p.sha; });

    var chain = Promise.resolve();
    deletes.forEach(function (name) {
      chain = chain.then(function () {
        return deleteOne(name, shaByName[name]).then(function () {
          tick("removed " + name);
        }).catch(function (err) {
          errors.push(err.message || String(err));
          done++;
        });
      });
    });
    uploads.forEach(function (up) {
      chain = chain.then(function () {
        return uploadOne(up).then(function () {
          tick("added " + up.filename);
        }).catch(function (err) {
          errors.push(err.message || String(err));
          done++;
        });
      });
    });

    chain.then(function () {
      pendingDeletes = {};
      pendingUploads.forEach(function (u) { URL.revokeObjectURL(u.previewUrl); });
      pendingUploads = [];
      setStatus("Refreshing…");
      return loadExisting();
    }).then(function () {
      setStatus("");
      if (errors.length) {
        showBanner("Saved with " + errors.length + " error(s): " + errors.join("; "), "error");
      } else {
        showBanner("Saved! The mirror will pick up changes shortly.", "ok");
        setTimeout(hideBanner, 4000);
      }
      updateSaveButton();
    });
  });

  function sha256Hex(str) {
    var enc = new TextEncoder().encode(str);
    return crypto.subtle.digest("SHA-256", enc).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  var mainEl = document.querySelector("main");
  var savebarEl = document.querySelector(".savebar");
  var gateEl = document.getElementById("gate");
  var pinInput = document.getElementById("pinInput");
  var pinSubmit = document.getElementById("pinSubmit");
  var pinError = document.getElementById("pinError");

  function startApp() {
    gateEl.style.display = "none";
    mainEl.style.display = "";
    savebarEl.style.display = "";
    loadExisting();
  }

  function tryUnlock() {
    var value = pinInput.value.trim();
    if (!value) return;
    sha256Hex(value).then(function (hex) {
      if (hex === CONFIG.pinHash.toLowerCase()) {
        try { sessionStorage.setItem("mirrorUnlocked", "1"); } catch (e) {}
        pinError.textContent = "";
        startApp();
      } else {
        pinError.textContent = "That's not it — try again.";
        pinInput.value = "";
        pinInput.focus();
      }
    });
  }

  pinSubmit.addEventListener("click", tryUnlock);
  pinInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") tryUnlock();
  });

  var tokenLooksReal = /^(ghp_|gho_|ghu_|ghs_|ghr_|github_pat_)[A-Za-z0-9_]+$/.test(CONFIG.token);
  var pinHashLooksReal = /^[a-f0-9]{64}$/i.test(CONFIG.pinHash);

  if (!tokenLooksReal || !pinHashLooksReal) {
    showBanner("This page hasn't been built yet — deploy it through build.sh with GITHUB_TOKEN and MIRROR_PIN set so it can talk to GitHub.", "warn");
  } else {
    var alreadyUnlocked = false;
    try { alreadyUnlocked = sessionStorage.getItem("mirrorUnlocked") === "1"; } catch (e) {}
    if (alreadyUnlocked) {
      startApp();
    } else {
      gateEl.style.display = "flex";
      pinInput.focus();
    }
  }
})();
</script>
